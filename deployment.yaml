apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcr-app
  namespace: ghcr-app
  labels:
    app: ghcp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghcr-app
  template:
    metadata:
      labels:
        app: ghcr-app
    spec:
      containers:
        - name: ghcr-app
          image: ghcr.io/ppbrown/ghcr-test:11
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
